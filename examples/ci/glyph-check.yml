name: Glyph

on:
  pull_request:
  push:

jobs:
  glyph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "glyph-instructions @ git+https://github.com/francescogabrieli/glyph.git@v0.2.0"
      - run: glyph version
      - run: glyph doctor
      - run: glyph check AGENTS.md AGENTS.glp --min-coverage 95 --min-operational-coverage 80 --min-reduction 20
