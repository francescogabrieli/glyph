name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: glyph version
      - run: glyph doctor
      - run: pytest
      - run: glyph benchmark benchmarks/
      - run: glyph benchmark-real . --patterns "AGENTS.md,README.md,CONTRIBUTING.md,CLAUDE.md,.github/copilot-instructions.md,.cursor/rules/*.mdc"
      - run: glyph compile benchmarks/backend-fastapi/AGENTS.md -o /tmp/backend.glp --strict --min-operational-coverage 80
      - run: glyph check benchmarks/backend-fastapi/AGENTS.md /tmp/backend.glp --min-coverage 90 --min-operational-coverage 80 --min-reduction 20
      - run: glyph inspect benchmarks/readme-dev-section/README.md --show-unmapped

  package-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: bash scripts/release-smoke.sh
      - run: python -m pip install -e ".[mcp]"
      - run: glyph mcp --help
