[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glyph-instructions"
version = "0.2.0"
description = "Instructions-as-Code toolchain for compact, measurable agent instruction manifests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Francesco Gabrieli" }]
keywords = ["agents", "instructions", "markdown", "cli", "semantic-manifest", "mcp", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.14",
  "pytest>=8.0",
  "ruff>=0.9",
  "tiktoken>=0.7",
]
mcp = [
  "mcp>=1.2",
]

[project.scripts]
glyph = "glyph.interfaces.cli:app"

[project.urls]
Homepage = "https://github.com/francescogabrieli/glyph"
Documentation = "https://github.com/francescogabrieli/glyph#readme"
Issues = "https://github.com/francescogabrieli/glyph/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/glyph/core/models.py",
  "src/glyph/semantics/clause_parser.py",
  "src/glyph/semantics/custom_rules.py",
  "src/glyph/semantics/policies.py",
  "src/glyph/formats/parser.py",
  "src/glyph/formats/renderer.py",
  "src/glyph/governance/lock.py",
  "src/glyph/governance/select.py",
  "src/glyph/governance/diff.py",
]
plugins = ["pydantic.mypy"]
show_error_codes = true
strict_optional = true
warn_unused_ignores = false

[tool.hatch.build.targets.wheel]
packages = ["src/glyph"]
